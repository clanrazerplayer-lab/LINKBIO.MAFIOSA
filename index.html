<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@CROSSRAZER | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/af5711d033.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            /* Cores para o Fundo Animado (Tons de Rosa e Roxo) */
            --bg-1: #ff75c3;
            --bg-2: #ffa647;
            --bg-3: #7043f6;
            --bg-4: #ff4d6d;
            
            --card-bg: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Configuração do Fundo Animado */
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-3), var(--bg-4), var(--bg-2));
            background-size: 400% 400%;
            animation: gradientAnim 15s ease infinite;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Keyframes da Animação do Fundo */
        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 1s ease-out;
            z-index: 1;
        }

        .profile-header {
            margin-bottom: 30px;
        }

        .profile-pic {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.4);
            padding: 4px;
            object-fit: cover;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .profile-pic:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: white;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-top: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-dim);
            margin-bottom: 32px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .link-card i {
            font-size: 1.3rem;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            font-weight: 300;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">

            <h1>mafiosattkofcl</h1>
            <p class="bio">Domine o jogo. Entre na comunidade.</p>

</body>
